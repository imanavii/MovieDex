
name: MovieDex Deployment Smoke Test

on:
  deployment_status:

permissions:
  contents: read
  deployments: read

jobs:
  smoke-test:
    name: Verify deployed website
    if: >-
      github.event.deployment_status.state == 'success' &&
      github.event.deployment_status.environment_url != ''
    runs-on: ubuntu-latest

    steps:
      - name: Check deployed homepage
        env:
          DEPLOY_URL: ${{ github.event.deployment_status.environment_url }}
        run: |
          set -euo pipefail

          echo "Checking deployment: $DEPLOY_URL"

          curl \
            --fail \
            --silent \
            --show-error \
            --location \
            --retry 12 \
            --retry-delay 10 \
            --retry-all-errors \
            --max-time 30 \
            "$DEPLOY_URL" \
            --output homepage.html

          if ! grep -qi "MovieDex" homepage.html; then
            echo "FAIL: Expected MovieDex content was not found."
            exit 1
          fi

          echo "PASS: Deployed homepage responds and contains MovieDex."
